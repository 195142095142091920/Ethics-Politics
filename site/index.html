<script type="application/json" id="gdefs">{"g-60-day-restraint": ["60-day restraint", "The Justice Department's practice of avoiding public enforcement steps against candidates close to an election. I believe it should be a fixed written rule, binding in every case, with an exception only for an immediate threat or evidence about to be lost.", "site S3, S13"], "g-abolitionism-animal-rights": ["Abolitionism (animal rights)", "The animal-rights view, linked to Gary Francione and Tom Regan, that animal use should be ended outright rather than made more humane. I share the goal: I believe animal agriculture, fishing, and animal testing should end on day one. Unlike Francione-style abolitionists, who are nonviolent and anti-carceral, I believe animal killing belongs on the capital track.", "standard meaning; site S1, S9"], "g-abolitionist-project-pearce": ["Abolitionist project (Pearce)", "David Pearce's proposal to use technology to abolish suffering in all sentient life, including suffering caused by predation in the wild. As I use it, it means the future \"reordering of nature against predation and suffering,\" pursued within U.S. borders in phases, with no step that causes more suffering than it prevents, each method expanding beyond pilot areas only after a published review shows it prevents more suffering than it causes.", "standard meaning; site S1, S7, S10"], "g-abortion-ban-from-conception": ["Abortion ban from conception", "The legal rule I support on elective abortion: it should be banned from conception, fixed by constitutional amendment. Sentience remains the moral and rights theory. The rights claim starts at 12 weeks, the earliest point in the published expert range for possible fetal sentience onset (~12 weeks to after 24-28 weeks). Before 12 weeks the ban rests on Axiom 3, which gives a fetus on its way to sentience significant moral weight, and Axiom 5, which errs on the side of consistency where science is unclear: no one can pin down exactly when sentience starts. It is also a safeguard, because countries that set a week limit keep raising it. Denmark and Norway raised their on-request limits from 12 to 18 weeks in 2025, France from 12 to 14 weeks in 2022, and Massachusetts Chapter 188 loosened later-term rules in 2026. The amendment should not move later when onset estimates are revised upward, and it should not be revised by the animal sentience-class board. Rape and life-of-mother exceptions should follow the responsibility and conflicts rules in the Abortion topic. I set this out in Cultural & Social Issues: Abortion and Bioethics.", "site S7"], "g-acled": ["ACLED", "The Armed Conflict Location & Event Data project, which tracks protests and political violence; it found campus protests 97% peaceful.", "standard meaning"], "g-actuarial-sex-facts": ["Actuarial sex facts", "Sex-based statistics on risk, such as life expectancy or accident rates, used in insurance pricing. I believe this is the one group statistic insurers should be allowed to use.", "site S7"], "g-age-of-criminal-responsibility": ["Age of criminal responsibility", "The age below which a child is presumed unable to commit a crime. Many countries fix it by law, commonly between 10 and 14, while many U.S. states set none. I believe there should be no fixed age: a minor's liability should follow the severity of the crime.", "standard meaning; site S6"], "g-agency": ["Agency", "Responsibility rests on agency, which scales with cognitive and experiential sophistication; only an agent can generate duties through voluntary choice or forfeit rights through deliberate violation. As I explain in Ethical and Philosophical Framework: Minors and Incompetent Adults.", "site S1"], "g-agnostic-atheism": ["Agnostic atheism", "Not believing in any god (atheism) while holding that the question can't be settled with certainty (agnosticism). I tie mine to burden-of-proof skepticism: a claim needs testable, repeatable proof before I accept it.", "standard meaning; site S1"], "g-ai-agi": ["AI, AGI", "AI is artificial intelligence. AGI, artificial general intelligence, is AI that matches or exceeds humans across most tasks.", "standard meaning"], "g-ai-preemption": ["AI preemption", "Preemption means federal law overrides state law. I believe national AI rules should preempt state law, but by statute passed by Congress, not executive order.", "site S10"], "g-alaska-certification-suit": ["Alaska certification suit", "The Justice Department's October 2026 lawsuit seeking to hold Alaska's U.S. Senate certification. I grade it Directionally opposed.", "site S12"], "g-alien-enemies-act": ["Alien Enemies Act", "A 1798 law letting the President detain and remove citizens of a hostile nation during a declared war or invasion. The administration invoked it against the Tren de Aragua gang in March 2025; I grade that Directionally aligned.", "standard meaning; site S12"], "g-ama-and-helsinki-codes": ["AMA and Helsinki codes", "The American Medical Association's Code of Medical Ethics, which bars physicians from taking part in executions, and the World Medical Association's Declaration of Helsinki, which requires informed consent in research. My S10 calls them private professional rules.", "standard meaning; site S10"], "g-america-first": ["America First", "A slogan for putting U.S. interests first in foreign and trade policy, used by the Trump administration. My version: \"I stand for America First realism with selective Western imperialism,\" meaning the United States should prioritize its sovereignty, security, cultural cohesion, and manufacturing strength (S8).", "site S8; standard meaning"], "g-amnesty": ["Amnesty", "Granting legal status to people living in the country unlawfully. I oppose it.", "standard meaning"], "g-anarcho-capitalism": ["Anarcho-capitalism", "The view that the state should be abolished and every service, including law, courts, and defense, supplied by private markets. I use it for Hans-Hermann Hoppe; I want a constitutional republic instead.", "standard meaning"], "g-anti-collectivism": ["Anti-collectivism", "Opposition to collectivism, the view that the group, class, or state comes before the individual and may direct individual lives and outcomes. I use it for my own politics: I believe rights belong to individuals, and each person should be judged as an individual, never by group.", "site home page"], "g-anti-naturalism-sentientist": ["Anti-naturalism (sentientist)", "Here, the rejection of nature as a moral standard, not the metaethical term. In S1 I say nature may be \"ethically indifferent or abominable,\" and in S7 that \"Nature needs to be civilized.\" I use the label only in this sense.", "standard meaning; site S1, S7"], "g-anti-totalitarian-parity": ["Anti-totalitarian parity", "My label for treating the excluded ideologies on the same terms in public memory. I believe the state should officially condemn all four and remove public honors for communist figures, while praising Nazism or communism stays legal.", "site S1, S2, S13"], "g-antitrust": ["Antitrust", "Law against monopolies and anti-competitive conduct. My view: \"big is not illegal.\"", "standard meaning; site S5"], "g-aquaculture-and-breeding-mills": ["Aquaculture and breeding mills", "Aquaculture is fish and shellfish farming; breeding mills are commercial operations that breed animals, such as dogs, in volume for sale. I believe both should end on day one.", "standard meaning; site S9"], "g-assimilationism": ["Assimilationism", "The view that newcomers should adopt the host society's values and way of life. In my selection order, Western-values fit and assimilation come first and American labor needs second (S8).", "standard meaning; site S2, S8"], "g-assisted-death": ["Assisted death", "A competent adult ending their own life with medical help. I believe it should be allowed, with safeguards.", "standard meaning; site S7"], "g-atkins-v-virginia-2002": ["Atkins v. Virginia (2002)", "Supreme Court case barring the execution of people with intellectual disability.", "standard meaning"], "g-autonomous-weapons-and-space-weapons": ["Autonomous weapons and space weapons", "Weapons that can select and strike targets without a human decision, and weapons based in space. I accept autonomous weapons only with human judgment kept, and defensive space weapons only.", "site S8"], "g-axioms-s1": ["Axioms (S1)", "The seven numbered principles at the base of my framework in S1, such as Axiom 5 (sentience set by revisable scientific consensus), Axiom 6 (the forfeiture threshold), and Axiom 7 (my system as \"a coherent system I choose to endorse and want enforced\").", "site S1"], "g-bailouts": ["Bailouts", "Government rescues of failing firms or banks with public money. I oppose them.", "standard meaning"], "g-basic-law-germany": ["Basic Law (Germany)", "Germany's constitution, adopted in 1949. It lets the Federal Constitutional Court ban parties that seek to abolish the democratic order, a model of militant democracy, and Article 102 states, \"Capital punishment is abolished.\"", "standard meaning; site S11"], "g-bioconservatism": ["Bioconservatism", "Opposition to human enhancement and to reproductive technologies such as cloning, usually on grounds of human dignity or the value of the natural, as argued by Leon Kass. I am against this camp.", "standard meaning"], "g-birthright-citizenship": ["Birthright citizenship", "Automatic citizenship for anyone born on U.S. soil, under the 14th Amendment as now read. I believe it should end by amendment, going forward only.", "standard meaning; site S8"], "g-bjs-bls-cbo": ["BJS, BLS, CBO", "Federal statistics and budget agencies: the Bureau of Justice Statistics, the Bureau of Labor Statistics, and the Congressional Budget Office.", "standard meaning"], "g-body-cameras": ["Body cameras", "Cameras worn by police and other officers to record their encounters. I want them everywhere, including for ICE.", "standard meaning"], "g-brain-computer-interfaces": ["Brain-computer interfaces", "Devices that connect the brain directly to a computer. I support them with opt-in neural data.", "standard meaning; site S10"], "g-building-bar": ["Building bar", "The bar on building, rebuilding, expanding, or relocating places that promote any of the four excluded ideologies, such as a Nazi gathering place or an Islamic center or school; new mosques are barred outright. \"The bar falls on the place and the symbols built into it, never on a person's belief, speech, or home practice\" (S3).", "site S3"], "g-bulk-tracking-facial-recognition-and-social-credit": ["Bulk tracking, facial recognition, and social credit", "Mass collection of location or other data on the population, automated identification of faces, scoring citizens' behavior, and selling personal data. I believe each should be opt-in, with a high bar for bulk tracking.", "site S3"], "g-capital-evidentiary-standard": ["Capital evidentiary standard", "Nobody should be executed unless the proof is overwhelming and backed by objective evidence such as video and physical evidence, not just testimony. I lay this out in Criminal Justice & Security: Evidentiary Standard.", "site S6"], "g-capital-track": ["Capital track", "Crimes I would treat as capital: punished by death (public) or the experimentation track, under the capital evidentiary standard. They include murder, violent rape, child molestation, kidnapping, trafficking, large-scale distribution of hard drugs, giving or selling any hard drug to a minor, cruelty causing lasting injury, and killing a high-class animal.", "site S1, S6"], "g-carryover-basis": ["Carryover basis", "A rule that an heir takes over the original owner's purchase price for tax purposes, so gains built up before death are taxed when the heir sells. I would use it instead of an estate tax: \"tax an heir's inherited gains when the assets are sold.\"", "standard meaning; site S5"], "g-cartels-as-terrorists": ["Cartels as terrorists", "My view that drug cartels, and governments that shelter them, are national-security threats to be defeated by force, including war on governments that refuse to cooperate.", "site S8"], "g-cat": ["CAT", "The UN Convention against Torture (1984), ratified by the U.S. in 1994. I believe the U.S. should denounce (withdraw from) it if needed, while keeping the bar on removing any resident to torture in statute.", "standard meaning; site S8"], "g-ceo-iq-id-us-uk-dc": ["CEO, IQ, ID, U.S., UK, D.C.", "CEO is chief executive officer; IQ is a standardized intelligence score; ID is identification; U.S. is the United States; UK is the United Kingdom; D.C. is Washington, D.C.", "standard meaning"], "g-cephalopods-decapods-bivalves": ["Cephalopods, decapods, bivalves", "Cephalopods are octopuses, squid, and cuttlefish; decapods are ten-legged crustaceans such as crabs, lobsters, and shrimp; bivalves are two-shelled animals such as clams, oysters, and mussels. I place cephalopods and decapod crustaceans in the high sentience class. Bivalves are likely not sentient and sit in no class; farming them ends with aquaculture for consistency, not as a sentience claim.", "standard meaning; site Glossary (Sentience class)"], "g-chapter-188-massachusetts": ["Chapter 188 (Massachusetts)", "A 2026 Massachusetts abortion law that loosened later-term rules. I cite it as an example of limits drifting past 12 weeks, which is why I believe the ban should run from conception.", "site Glossary (Abortion ban); site S13"], "g-charter-schools": ["Charter schools", "Publicly funded schools run independently of the local school district. My per-child funding can follow a child to them.", "standard meaning"], "g-child-credit-and-birth-credit": ["Child credit and birth credit", "My proposed family credits: a child credit that doubles from the third child and a birth credit for third and later children, meant to raise births under lower immigration.", "site S5"], "g-citizen-initiative": ["Citizen initiative", "A process that lets voters put a law or constitutional amendment on the ballot by gathering signatures and then decide it by popular vote, as in Switzerland and many U.S. states. I believe states and localities should be free to offer initiatives and referendums, open only to qualified voters, and I support a national initiative.", "standard meaning; site S3"], "g-civic-disabilities": ["Civic disabilities", "My term for the two restrictions on excluded ideologies, the office bar and the building bar. As I write, they \"are not penalties\": no one is fined, jailed, or silenced for belief.", "site S1, S2"], "g-civil-asset-forfeiture": ["Civil asset forfeiture", "A legal process in which the government seizes property it says is tied to crime through a civil case against the property itself, often without convicting or even charging the owner. Unlike rights forfeiture in my framework, I believe civil forfeiture without conviction should end.", "standard meaning; site S3"], "g-civil-libertarianism": ["Civil libertarianism", "Strong protection of individual freedoms, such as privacy, speech, and a fair trial, against the state. \"Procedural\" stresses safeguards on how the state acts: I believe data, facial recognition, and social credit should be opt-in, and I want body cameras everywhere, a high bar for bulk tracking, and no qualified immunity.", "standard meaning; site S3, S6"], "g-civil-service-merit-hiring": ["Civil service merit hiring", "Hiring government workers by qualification rather than politics. I believe policy roles should serve at the pleasure of elected officials, with fast removal for stated reasons.", "site S5"], "g-civilizational-nationalism": ["Civilizational nationalism", "My stance that a nation should protect and pass on a civilization defined by shared Western values, not by ethnicity: \"a set of values, not an ethnicity.\" It drives my immigration selection, which puts values fit and assimilation first (S2, S8).", "site S2"], "g-classical-liberalism": ["Classical liberalism", "The tradition of limited government, individual rights, free markets, and the rule of law, from Locke and Adam Smith through Milton Friedman.", "standard meaning"], "g-clear-and-convincing-evidence": ["Clear and convincing evidence", "A standard of proof higher than \"more likely than not\" but lower than \"beyond a reasonable doubt\": the fact must be shown to be highly probable. I would require it for the court finding before a green card or visa holder is removed.", "standard meaning; site S8"], "g-close-in-age-exception": ["Close-in-age exception", "A rule, sometimes called a \"Romeo and Juliet\" clause, that relationships between teenagers close in age are not treated as statutory rape. I believe the age of consent should be 18 with such an exception.", "standard meaning; site S6, S7"], "g-coker-v-georgia-1977": ["Coker v. Georgia (1977)", "Supreme Court case barring the death penalty for the rape of an adult woman where the victim is not killed.", "standard meaning"], "g-colorblind-meritocracy": ["Colorblind meritocracy", "The view that law and institutions should not treat people differently by race and should reward individual merit. As I write, \"Every offender should be judged as an individual, by the same law,\" and \"race doesn't matter in itself; culture and assimilation do\" (S6, S7).", "standard meaning; site S6, S7"], "g-combatant-track": ["Combatant track", "My rule for foreign cartels formally designated as war enemies or Foreign Terrorist Organizations: their property should be seized as enemy property under the laws of war, without a domestic civilian conviction. It is not civil forfeiture, and domestic gangs and undesignated actors would still require a conviction and full due process.", "site S3"], "g-companions-in-guilt-argument": ["Companions-in-guilt argument", "A reply to moral anti-realism: if moral facts are too strange to exist, so are other facts we accept, such as reasons for belief, so the anti-realist argument proves too much. S1 answers this reply in full.", "standard meaning; site S1"], "g-competence-qualification": ["Competence qualification", "The second half of my qualified franchise: passing the voter license test on issues, civics, and laws.", "site S3"], "g-competing-currencies": ["Competing currencies", "Letting private or alternative currencies circulate alongside the dollar.", "standard meaning"], "g-constitutionalism": ["Constitutionalism", "Government limited by a written constitution and the rule of law, so that officials can't act beyond the powers it grants.", "standard meaning"], "g-constructivism-humean": ["Constructivism (Humean)", "In metaethics, the view that moral norms are built from the attitudes and choices of agents rather than discovered as outside facts. \"Humean\" means rooted in human sentiment and choice, after David Hume. S1 calls my view \"constructivist in the Humean sense.\"", "standard meaning; site S1"], "g-corporate-veil": ["Corporate veil", "The legal separation that normally protects owners and managers from a company's debts and liabilities. \"Piercing the veil\" means a court holds them personally liable anyway, which I believe should happen for deliberate violations.", "standard meaning; site S6"], "g-cosmopolitan-liberalism": ["Cosmopolitan liberalism", "Liberalism that gives equal moral weight to every person regardless of nationality, usually favoring open borders and global institutions. Jason Brennan pairs it with epistocracy; I pair epistocracy with civilizational nationalism.", "standard meaning"], "g-cultural-marxism": ["Cultural Marxism", "As I use it, the critical theory of the Frankfurt School and the strands that grew from it, which recast Marx's class struggle as oppressed groups against oppressors and carry it into culture, institutions, and education. I see it as the main way communism is carried today, and I condemn it because it assigns a person's standing by group instead of by merit or conduct. Critics call the term a conspiracy-theory label; I claim no plot, only published ideas and their spread.", "site S2"], "g-cultural-traditionalism": ["Cultural traditionalism", "A preference for traditional family and social forms. Mine is \"preference, not mandate\": I believe traditional roles are best but should never be mandated.", "standard meaning; site S7"], "g-data-box": ["Data box", "A collapsible callout I use that collects figures and studies on a topic, including counter-evidence.", "site"], "g-day-fines-income-scaled-fines": ["Day fines (income-scaled fines)", "Any criminal, civil, or regulatory fine should be set in proportion to the offender's income and wealth. Individuals should pay day fines with no floor or cap, always alongside labor that scales with severity. Corporations should pay a share of global revenue, or their gain from the offense if higher, and the CEO should be personally responsible by default, serving the labor and paying a personal fine; the same should apply to heads of nonprofits and religious groups. I set this out in Criminal Justice & Security: Income-Scaled Fines.", "site S6"], "g-day-one-bans": ["Day-one bans", "My position that animal agriculture, fishing, aquaculture, breeding mills, and animal testing should be \"banned outright and instantly,\" with \"no lag at all\" and no gradual wind-down (S1).", "site S1, S9"], "g-death-row": ["Death row", "The years-long wait between a death sentence and execution. I want 30-day capital trials and same-day execution, with no death row.", "standard meaning; site S6"], "g-debt-brake": ["Debt brake", "An automatic rule I would adopt that would raise the temporary income surcharge when debt runs above its legislated path, be suspended in recessions, and force spending cuts if it stays on. I lay this out in Domestic Policy & Governance: Fiscal Policy and Taxation.", "site S5"], "g-deceptive-candidacies": ["Deceptive candidacies", "Candidates entered mainly to mislead voters or split the vote. I believe the rules for handling them should be fixed before the election (S3 Ballot Access and Deceptive Candidacies).", "standard meaning; site S3"], "g-deepfakes": ["Deepfakes", "AI-generated video, audio, or images that realistically show someone saying or doing something they didn't. I treat deepfakes as speech (S10, S13).", "standard meaning; site S10"], "g-default-enrollment-opt-out-defaults": ["Default enrollment (opt-out defaults)", "Signing people up automatically while letting them leave freely. I would use it only where a person protects themselves, as with private disability insurance, retirement accounts, and index accounts, citing Madrian and Shea's finding that 401(k) participation rose from 37% to 86% under automatic enrollment.", "site S5, S10"], "g-defensive-accelerationism": ["Defensive accelerationism", "A stance, often called \"d/acc,\" that favors fast technological progress while giving priority to defensive technologies against catastrophic risk. It fits my view on AI: pro-AI, with AI regulated as an existential risk and a defensive AGI prepared (S10).", "standard meaning"], "g-dei": ["DEI", "Diversity, equity, and inclusion: programs that give weight to group identity in hiring, admissions, and training. I believe in no quotas or DEI.", "standard meaning; site S7"], "g-deontology": ["Deontology", "Ethics built on duties and rights that may not be violated, rather than on producing the best outcomes. Its main rival is utilitarianism.", "standard meaning"], "g-desert": ["Desert", "Desert means punishment matched to what the offender earned by the crime, regardless of whether it deters. As I explain in Criminal Justice & Security: Deterrence and the Justification for Capital Punishment.", "standard meaning; site S6"], "g-deterrence": ["Deterrence", "Justifying punishment by its power to discourage future crime. I do not ground punishment in deterrence; I ground it in desert, incapacitation, and forfeiture.", "standard meaning; site S6"], "g-directional-transactional-independent": ["Directional (transactional) independent", "A voter with no party identity who backs whichever side moves policy most in their direction. My homepage calls my support \"a cost analysis,\" and S11 says \"No modern political party aligns with my entire system.\"", "site homepage, S11"], "g-disparate-impact": ["Disparate impact", "The legal rule, from Griggs v. Duke Power Co. (1971) and Title VII, that a neutral practice causing a disparate impact by race, sex, or another protected trait is unlawful unless the employer shows it is job-related and a business necessity. I believe disparate-impact liability should be repealed.", "site S7"], "g-displacement-trigger-bls-trigger": ["Displacement trigger (BLS trigger)", "My rule for AI job loss: after four straight quarters with the BLS labor share at least 3 points below its ten-year average and the prime-age employment-to-population ratio at least 2 points below its level three years earlier, the tax on capital income would rise from 15% to the 20% flat rate, then by a surcharge of up to 5 points after eight quarters, never above 25% including the transition surcharge and the Sanctuary Levy. Each step reverses when the measures recover for four quarters.", "site S10"], "g-distributive-justice-patterned-principles": ["Distributive justice (patterned principles)", "The question of how a society's goods should be shared. Robert Nozick contrasted patterned principles, such as \"to each according to need,\" with historical ones that ask only whether holdings were justly acquired and transferred. I hold that distributive patterns are not themselves the measure of justice.", "standard meaning; site S1"], "g-dominant-party-state": ["Dominant-party state", "A state that holds elections but where one party wins every time and governs for decades, as the People's Action Party has in Singapore since 1959. I want an epistocratic republic, not a dominant-party state.", "standard meaning"], "g-double-jeopardy": ["Double jeopardy", "The Fifth Amendment rule that a person can't be tried twice for the same offense after an acquittal or conviction. My retrial-after-nullification rule departs from it, which I acknowledge (S3).", "standard meaning; site S3"], "g-dsa": ["DSA", "Democratic Socialists of America, a left-wing political organization.", "standard meaning"], "g-due-process": ["Due process", "The constitutional guarantee, in the Fifth and Fourteenth Amendments, that government cannot take life, liberty, or property without fair legal procedure: notice, a hearing, and an impartial judge. I believe maximal penalties should always come with strict due process.", "standard meaning"], "g-duty-to-retreat": ["Duty to retreat", "A rule in some U.S. states that a person must retreat, if they safely can, before using deadly force in self-defense outside the home; \"stand your ground\" laws remove it. I believe people should be free to defend themselves or others anywhere, with no duty to retreat.", "standard meaning; site S3"], "g-earnings-only-top-up": ["Earnings-only top-up", "Under my tax plan, low earners would receive a top-up built into the flat tax's zero bracket: a negative income tax paid only on earned income, never for not working. I set this out in Domestic Policy & Governance: Welfare and Entitlements.", "site S5"], "g-east-potomac-golf-closure": ["East Potomac golf closure", "The Park Service's 2026 move to close the public golf course at East Potomac Park in Washington for redevelopment, now paused by a court order. I grade it Directionally opposed.", "site S12"], "g-eco-modernism": ["Eco-modernism", "Environmentalism that relies on technology, growth, and dense energy sources like nuclear power to shrink human impact, instead of cutting consumption. Mine is \"reliability first, no mandates, nuclear yes.\"", "standard meaning; site S9"], "g-economic-nationalism": ["Economic nationalism", "Using tariffs, mandates, and industrial policy to build up domestic industry. I prefer tax and regulatory relief to tariffs and mandates.", "standard meaning"], "g-eighth-amendment": ["Eighth Amendment", "The part of the U.S. Constitution that bans \"cruel and unusual punishments\" and excessive bail and fines. I believe it should be amended or abolished.", "standard meaning; site S6"], "g-eitc-and-ctc": ["EITC and CTC", "The Earned Income Tax Credit (a refundable credit for low- and moderate-income workers) and the Child Tax Credit (a per-child credit). I believe the earnings-only top-up should replace both.", "standard meaning; site S5"], "g-emergency-on-scene-sentencing": ["Emergency on-scene sentencing", "My position that inside a declared, time-limited emergency, police or military could sentence on the spot. The capital standard, body cameras, and later review would still apply, and an officer whose sentence is not supported would be charged with murder.", "site S3, S6"], "g-emergency-powers-and-sunset-clauses": ["Emergency powers and sunset clauses", "Emergency powers are special powers a government claims in a crisis; a sunset clause makes a law or power expire on a set date unless renewed. I believe emergencies should be necessary, narrow, temporary, and expire automatically unless the legislature renews them.", "standard meaning; site S3, S12"], "g-energy-emergency-and-dc-guard-deployment": ["Energy emergency and D.C. Guard deployment", "The national energy emergency declared by Executive Order 14156 in January 2025 and renewed by the President, and the National Guard deployment in Washington, D.C. I fault both for open-ended renewals.", "site S12"], "g-epistocracy": ["Epistocracy", "\"Epistocracy means rule by the knowledgeable.\" The term is Jason Brennan's. In my system the vote would go to citizens who meet a stake qualification and a competence qualification.", "site Glossary; site S3"], "g-epistocratic-republic": ["Epistocratic republic", "The constitutional republic I support, with a qualified (restricted) franchise, also called a limited democracy rather than a full democracy. Epistocracy means rule by the knowledgeable. Elections, ranked-choice voting, and the Constitution would stay, and the vote should go to citizens who meet a stake qualification, the net fiscal voting bar, and a competence qualification, the voter license test on issues, civics, and laws. I lay this out in Authority & Civil Liberties: Epistocratic Republic and Qualified Franchise.", "site S3"], "g-esa-education-savings-account": ["ESA (education savings account)", "An education savings account: state money put into an account parents can spend on private school and other approved education costs. Not the same as the Endangered Species Act. I oppose them.", "standard meaning; site S5"], "g-esa-harm-rule-endangered-species-act": ["ESA \"harm\" rule (Endangered Species Act)", "The Endangered Species Act. Its regulatory definition of \"harm,\" which since 1981 covered habitat damage that actually kills or injures listed wildlife, was rescinded effective September 14, 2026. I grade that Opposed.", "site S12"], "g-estate-wealth-vat-and-sales-taxes": ["Estate, wealth, VAT, and sales taxes", "An estate tax is levied on what a person leaves at death; a wealth tax on total net worth each year; a VAT (value-added tax) and a sales tax on purchases. I believe none should exist at any level of government.", "standard meaning; site S5"], "g-et": ["ET", "Eastern Time (U.S.), the time zone I use for all times here.", "standard meaning"], "g-ethnonationalism": ["Ethnonationalism", "Nationalism that defines the nation by shared ancestry or ethnicity. My test is about values and open to any ancestry.", "standard meaning"], "g-eudaimonism-stoic": ["Eudaimonism (Stoic)", "Ethics aimed at eudaimonia, a flourishing life lived through virtue. The Stoic version ties flourishing to virtue, composure, and accepting what one can't control. I use it for personal character only, not for politics.", "standard meaning; site S1"], "g-evidentialism": ["Evidentialism", "The rule that belief should match the evidence. My standard in S1: \"Proof here means testable, repeatable evidence or reasoning that others can check.\"", "standard meaning; site S1"], "g-evolutionary-debunking": ["Evolutionary debunking", "The argument (Sharon Street, Richard Joyce) that evolution shaped our moral beliefs for survival rather than truth, which undercuts the claim that they track objective moral facts. It is one of my three arguments for anti-realism in S1.", "standard meaning; site S1"], "g-ex-post-facto": ["Ex post facto", "Punishing an act that was legal when it was done. I believe no one should be punished for animal killings before the ban.", "standard meaning; site S1"], "g-excluded-ideologies": ["Excluded ideologies", "The four ideologies my proposed constitutional amendment names: Nazism, communism, socialism, and Islam, held on the same terms. I believe their adherents should be barred from sworn authority roles (the office bar) and that places promoting them should be capped (the building bar). No one would be fined, jailed, removed, or silenced for holding or advocating any view.", "site S1; site Glossary (Office bar)"], "g-executive-discretion-over-federal-property": ["Executive discretion over federal property", "My view that the President may decide on monuments and improvements on property the executive already controls, preferably privately or opt-in funded, but that this discretion \"is not a power to take new land, spend money Congress has not appropriated, or go beyond the laws that authorize the executive.\"", "site S5, S12"], "g-existential-risk": ["Existential risk", "A risk that could cause human extinction or permanently and drastically curtail humanity's future, such as misaligned advanced AI or an engineered pandemic. I believe regulation should be limited to research that creates existential risk.", "standard meaning; site S10"], "g-experimentation-track": ["Experimentation track", "A sentence for offenders who have forfeited the right to life (the capital tier or three marks): instead of execution, they would be used as research subjects in place of animals. I believe the victim should choose between execution and experimentation; where the victim is dead, the default is the experimentation track unless the victim's close family or friends step forward and choose, and it stays the default if they disagree; where there is no single victim, the judge should choose and may not refuse. Harm outside the sentence, such as guard abuse unrelated to a study, should still be punished.", "site S6, S10"], "g-fed-federal-reserve": ["Fed (Federal Reserve)", "The U.S. central bank. I believe in a single price-stability rule, no bailouts, competing currencies, no gold standard, and governors removable only for cause.", "standard meaning; site S5"], "g-federalism": ["Federalism", "Dividing power between the national government and the states. Mine puts defense, borders, and immigration at the federal level and schools at the local level.", "standard meaning"], "g-felony-and-misdemeanor": ["Felony and misdemeanor", "As I would define them, a felony is any offense worth two or more marks, or any capital-tier crime. A misdemeanor is any offense worth one mark or a fine without a mark. As I write in Criminal Justice & Security: Repeat Offenders and Forfeiture of the Right to Life.", "site S6"], "g-fisa-702": ["FISA 702", "Section 702 of the Foreign Intelligence Surveillance Act, which lets agencies collect communications of foreigners abroad from U.S. providers without a warrant and sweeps in Americans' messages. S3 cites a 2022 FISA Court finding of more than 278,000 noncompliant FBI queries.", "standard meaning; site S3"], "g-fixed-term-labor-track": ["Fixed-term labor track", "The fixed-term labor track, as I would set it, is the lesser tier, one or two marks, served for a term the judge should set in proportion to the harm, with a known end date. I set this out in Criminal Justice & Security: Abolition of Permanent Incarceration and Compelled Labor.", "site S6"], "g-flag-burning-prosecution": ["Flag-burning prosecution", "The August 2025 executive order directing prosecution tied to flag burning. I grade it Opposed because I believe only true threats and incitement should be punishable.", "site S12"], "g-flat-tax": ["Flat tax", "A single income-tax rate for everyone above an exempt amount. Mine is 20% above the zero bracket, with 15% on capital income.", "standard meaning; site S5"], "g-floor-minimal-welfare-floor": ["Floor (minimal welfare floor)", "The minimal provision I would fund from taxes: emergency shelter and emergency medical care, about $10,000 per child for K-12, the earnings-only top-up, and the last-resort allowance. It is \"not a right anyone can claim\" but part of the state's security role (S1).", "site S1, S5"], "g-ford-v-wainwright-1986": ["Ford v. Wainwright (1986)", "Supreme Court case barring the execution of people who are insane at the time of execution.", "standard meaning"], "g-foreign-terrorist-organization-fto": ["Foreign Terrorist Organization (FTO)", "A foreign group the U.S. Secretary of State formally designates as terrorist under the Immigration and Nationality Act; giving it material support becomes a federal crime, and its U.S. assets can be blocked. I believe designated foreign cartels should be treated as war enemies.", "standard meaning; site S3, S8"], "g-forfeiture-rights-forfeiture": ["Forfeiture (rights forfeiture)", "In my framework, forfeiture should be triggered only when an agent crosses the threshold set in Axiom 6: violating another's negative rights through force or fraud, or directly imposing a severe, non-consensual risk of serious harm. I set this out in Ethical and Philosophical Framework: Axioms.", "site S1"], "g-frankfurt-school-critical-theory": ["Frankfurt School (critical theory)", "A circle of Marxist thinkers at the Institute for Social Research in Frankfurt, founded in 1923, including Max Horkheimer, Theodor Adorno, and Herbert Marcuse. Their critical theory, as Horkheimer defined it in 1937, aims not at knowledge for its own sake but at changing society.", "standard meaning; site S2"], "g-free-market-capitalism": ["Free-market capitalism", "An economic system in which property is privately owned and prices, production, and trade are set by voluntary exchange rather than by the state. I support it, with regulation that has to justify itself and no business subsidies without opt-in.", "standard meaning; site S5"], "g-friedmanite": ["Friedmanite", "In the tradition of economist Milton Friedman: free markets, a negative income tax in place of many welfare programs, and money managed by a fixed rule.", "standard meaning"], "g-full-expensing": ["Full expensing", "Letting businesses deduct the full cost of equipment and other investments in the year they buy them, rather than spreading it over years. I support it now.", "standard meaning; site S5"], "g-full-retirement-age": ["Full retirement age", "The age at which Social Security pays unreduced benefits, 67 for people born in 1960 or later.", "standard meaning"], "g-fusionism": ["Fusionism", "The postwar American conservative blend, associated with Frank Meyer, of free-market liberty, traditional values, and anti-communism. It is one of the traditions closest to my view.", "standard meaning"], "g-futurism": ["Futurism", "As I use it, an outlook that welcomes and plans for a future reshaped by technology, such as AI, genetic enhancement, and lab-grown meat. It is not the early-20th-century Italian art movement of the same name.", "site home page"], "g-gain-of-function-research": ["Gain-of-function research", "Research that makes pathogens more transmissible or dangerous to study them. I believe it should be regulated as an existential risk.", "standard meaning; site S10"], "g-gene-drives": ["Gene drives", "A genetic technique that spreads a chosen trait through a wild population much faster than normal inheritance.", "standard meaning"], "g-geneva-iv-art-49": ["Geneva IV Art. 49", "Article 49 of the Fourth Geneva Convention (1949), which bars an occupying power from forcibly transferring or deporting protected civilians out of occupied territory, or moving its own civilians in. I acknowledge my West Bank removals conflict with it.", "standard meaning; site S8"], "g-geneva-limits-on-pow-labor": ["Geneva limits on POW labor", "The Third Geneva Convention lets captors put prisoners of war to work only under limits: paid, safe, non-military work, and never officers by compulsion. I believe POWs a tribunal finds to have fought should be open to compelled labor beyond those limits.", "standard meaning; site S8"], "g-gifted-tracks": ["Gifted tracks", "Separate, faster classes for high-ability students. I believe every school system should be required to offer them.", "site S5"], "g-global-south": ["Global South", "A broad term for the developing countries of Africa, Latin America, and much of Asia, used in place of \"Third World.\" I believe ties with them should serve U.S. interests and help move supply chains away from China.", "standard meaning; site S8"], "g-gold-card": ["Gold Card", "Executive Order 14351's expedited immigrant-visa path for a $1 million gift to the Department of Commerce. I grade it Directionally opposed because I believe admission should go by values and vetting, not wealth.", "site S12"], "g-gold-standard": ["Gold standard", "Tying a currency's value to a fixed amount of gold. I don't support it.", "standard meaning"], "g-gop": ["GOP", "\"Grand Old Party,\" the U.S. Republican Party.", "standard meaning"], "g-grave-tier": ["Grave tier", "In my framework, the grave tier would cover grave abuse that does not cause lasting injury; it would count as three marks at once: execution, experimentation, or life with labor, as the victim chooses. I lay this out in Criminal Justice & Security: Abolition of Permanent Incarceration and Compelled Labor.", "site S6"], "g-green-card": ["Green card", "U.S. lawful permanent residence. I believe green-card and visa holders should be removed after a court finding by clear and convincing evidence, for welfare use, failing the civics test, or any crime above a basic infraction.", "standard meaning; site S8"], "g-greens-libertarian-and-constitution-parties": ["Greens, Libertarian, and Constitution parties", "Smaller U.S. parties: the Green Party (environmentalist, left), the Libertarian Party (minimal government), and the Constitution Party (religious conservative). I see the Greens as closest on animals and nothing else.", "standard meaning; site S11"], "g-hard-drugs": ["Hard drugs", "Drugs such as heroin, cocaine, methamphetamine, and fentanyl, as opposed to marijuana. I believe private use should be legal and large-scale distribution a capital crime, with no commercial market. Smaller transfers fall on lower tiers, and sharing a known, tested dose with a consenting adult is not capital. Giving or selling any hard drug to a minor is capital at any quantity.", "standard meaning; site S6, S7"], "g-hard-entry-ban": ["Hard entry ban", "The top tier of the Questionable Compatibility list: a complete entry ban by nationality or place of origin, with no case-by-case visa path.", "site S8"], "g-harm-based-limits-greenhouse-gases": ["Harm-based limits (greenhouse gases)", "My rule that greenhouse gases above the natural baseline are pollution and should be governed by limits tied to actual harm, tightening if credible tail risk appears.", "site S9"], "g-herbivorization": ["Herbivorization", "The proposal, associated with David Pearce, to reengineer predators over time so they no longer kill other animals. I support it through gene drives and fertility control, within U.S. borders, in phases, with no step that causes more suffering than it prevents, each method expanding beyond pilot areas only after a published review shows it prevents more suffering than it causes.", "standard meaning; site S1, S7, S10"], "g-hereditarian-research": ["Hereditarian research", "Research holding that genetic differences explain part of measured group differences in traits such as IQ. S6 calls whether the ability gap is genetic \"unresolved\" and lays out both hereditarian and environmental research.", "standard meaning; site S6"], "g-hijra": ["Hijra", "Muhammad's migration from Mecca to Medina in 622, which marks year one of the Islamic calendar; the Quran also makes migration a religious duty for believers who are oppressed where they live. As I use it, it also names Islamic expansion through migration and integration, a way of taking over countries from within.", "standard meaning; site S4"], "g-horse-soring-bear-baiting-angling-grazing": ["Horse soring, bear baiting, angling, grazing", "Soring is deliberately injuring a horse's legs or hooves to exaggerate its gait in shows; bear baiting is hunting bears over food bait; angling is recreational fishing; grazing means livestock grazing on public land. As I write, the administration actions on each are graded Opposed.", "site S12"], "g-hostile-conduct-loss-of-civilian-protection": ["Hostile conduct (loss of civilian protection)", "My rule that civilian protection should be absolute except for foreign actors who forfeit it by hostile conduct, as a court finds. Individuals found hostile this way, for example in the West Bank, should be forced out.", "site S8"], "g-hot-spot-policing": ["Hot-spot policing", "Concentrating police patrols and enforcement on the small areas, often a few blocks, where much of a city's crime clusters. A Campbell systematic review of 65 studies found small but significant crime reductions. I support it, with fast, harsh crackdowns in gang and high-crime areas.", "standard meaning; site S6"], "g-icc-and-rome-statute": ["ICC and Rome Statute", "The International Criminal Court in The Hague, created by the 1998 Rome Statute, tries genocide, war crimes, and crimes against humanity. The U.S. is not a party; I oppose any role for it.", "standard meaning; site S8"], "g-iccpr": ["ICCPR", "The International Covenant on Civil and Political Rights (1966), a UN treaty the U.S. ratified in 1992. It limits the death penalty and bars medical or scientific experimentation without free consent. I believe the U.S. should exit it to protect the experimentation track and new capital offenses.", "standard meaning; site S8"], "g-ice": ["ICE", "U.S. Immigration and Customs Enforcement, the federal agency that detains and deports people in the country unlawfully. I believe it should be expanded, with body cameras.", "standard meaning"], "g-in-short": ["In short", "The one-paragraph summary box at the top of each of my topics.", "site"], "g-incapacitation": ["Incapacitation", "Justifying punishment by stopping the offender from committing more crimes. It is one of my three grounds, with desert and forfeiture.", "standard meaning; site S6"], "g-index-account": ["Index account", "A low-cost private investment account that every adult would be enrolled in by default, with a free opt-out and no taxpayer seed. The state should not run or hold the accounts.", "site S10"], "g-infestation": ["Infestation", "When a high-class pest population occupies a dwelling, a food store, or a medical facility in a way that foreseeably spreads pathogens or destroys necessary stores. Those three sites only. A food store is a structure used to store food for persons or animals under care — not an open field, and not a general agricultural barn that is not a food store. A qualifying infestation is a clear disease or rights threat: lethal control of the occupying population should be treated as lawful self-defense / defense of rights, with separation or exclusion first where they will work and the least-harmful method should be required. Pest status should not demote the species. Rats, mice, pigeons, and other high-class animals should stay in the high class. Preventive area-wide extermination of high-class animals that are not occupying a qualifying site remains murder. Hunger, nuisance alone, or fear that pests might arrive later is not an infestation. I set this out in Cultural & Social Issues: Hunting, Fishing, Pets, and Zoos and Ethical and Philosophical Framework: Animal Rights and Sentientism.", "site S7, S1"], "g-ipcc-and-fao": ["IPCC and FAO", "The Intergovernmental Panel on Climate Change, the UN's climate-science body, and the Food and Agriculture Organization of the UN, whose figures put animal agriculture at about 12% of human greenhouse-gas emissions (2015 reference year).", "standard meaning; site S9"], "g-islam-as-an-excluded-ideology": ["Islam (excluded)", "Excluded Islam = Islam judged by its mainstream legal tradition, which gives non-Muslims and women lesser standing and prescribes death for leaving the faith. As I write, \"Islam is a political ideology whose goal is sharia, the rule of Islamic law,\" which is why it is the one religion among the four excluded ideologies. That is what the excluded-ideologies amendment I support would bar from office and from building places that promote it (Excluded ideologies). Adherence: something checkable, like a sworn statement or the group's own membership records; ancestry alone never counts. For a group with no membership records, adherence is shown by a sworn statement or the person's own public profession of the ideology, never ancestry alone. Eligibility after leaving returns after a formal renunciation that the group's own process recognizes, with perjury covering lies. For a faith with no central membership body or exit process, such as Islam, the renunciation is a sworn public renunciation, and lying in it is perjury (Oath of Office and Perjury). Not covered: belief, speech, and home practice, which would stay free, and ordinary non-authority public jobs. No other faith meets the test, so Christianity, Judaism, and atheism are not barred.", "site S1, S4"], "g-islamism": ["Islamism", "The political project of ruling by Islamic law (sharia), whose jihadist wing pursues the same goal by terror. I condemn Islam itself, not only its political project, as one of the four excluded ideologies.", "standard meaning; site S2"], "g-ivf-crispr-and-embryo-screening": ["IVF, CRISPR, and embryo screening", "IVF (in vitro fertilization) creates embryos outside the body; embryo screening tests them for genetic conditions before implantation; CRISPR is a gene-editing tool. I support all three, IVF unrestricted.", "standard meaning; site S10"], "g-jacksonian": ["Jacksonian", "Walter Russell Mead's name for an American foreign-policy tradition, after Andrew Jackson: fierce against enemies, pro-military, wary of nation-building and international bodies, and usually protective of entitlements and tariffs. My foreign policy is close to it, though I oppose protecting entitlements and broad tariffs.", "standard meaning"], "g-jones-act": ["Jones Act", "A 1920 law requiring ships that carry goods between U.S. ports to be U.S.-built, -owned, -flagged, and -crewed. I believe the mandate should go.", "standard meaning; site S12"], "g-jury-nullification": ["Jury nullification", "When a jury acquits despite the evidence because it believes the law, or applying it in that case, is unjust. Under my S3 rules juries can nullify, but I believe a nullification acquittal in a mandatory-death-penalty case should be open to one retrial before a different jury.", "standard meaning; site S3"], "g-k-12": ["K-12", "Kindergarten through 12th grade, meaning primary and secondary school.", "standard meaning"], "g-kantian-dignity": ["Kantian dignity", "Immanuel Kant's idea that persons have an inner worth and must never be treated merely as means. In S10 I say: \"My framework doesn't rest on Kantian dignity. It rests on negative rights, which an agent forfeits by violating them in others.\"", "standard meaning; site S10"], "g-kennedy-v-louisiana-2008": ["Kennedy v. Louisiana (2008)", "Supreme Court case barring the death penalty for child rape where the victim is not killed.", "standard meaning"], "g-lab-grown-meat": ["Lab-grown meat", "Meat grown from animal cells instead of taken from slaughtered animals, also called cultivated or cultured meat. I see it as the goal and the replacement for animal agriculture, and I believe it should be allowed to compete and scale up even if it can't meet demand at the same cost right away.", "standard meaning; site S9, S10"], "g-last-resort-allowance": ["Last-resort allowance", "A strictly means-tested allowance I would provide for severe disability and the elderly poor, from general revenue under the backstop logic, with fraud enforcement and periodic medical reviews; a narrow exception. I set this out in Domestic Policy & Governance: Welfare and Entitlements.", "site S5"], "g-law-firm-orders-and-the-comey-firing": ["Law-firm orders and the Comey firing", "Executive orders limiting security clearances and federal access for specific law firms, and the 2025 firing of prosecutor Maurene Comey (daughter of former FBI Director James Comey) without stated cause, later ruled unlawful. I grade both Directionally opposed.", "site S12"], "g-lesser-homicide": ["Lesser homicide", "My category for a self-defense killing that went too far but was close to justified, similar to what some U.S. states call imperfect self-defense. The prosecution should have to prove intent, and the judge should set a lighter sentence.", "site S6"], "g-liberal-counter-jihad": ["Liberal counter-jihad", "A label for secular, socially liberal politicians, such as Pim Fortuyn in the Netherlands, who oppose Islam and Muslim immigration in the name of liberal values like gay rights and women's equality.", "standard meaning"], "g-libertarian-paternalism": ["Libertarian paternalism", "Richard Thaler and Cass Sunstein's idea, also called \"nudge,\" of steering choices with default settings that people can freely opt out of. It describes my opt-out defaults for retirement accounts, private disability insurance, and index accounts (S5, S10).", "standard meaning"], "g-libertarianism": ["Libertarianism", "A political philosophy that puts individual liberty and property first and keeps state coercion to a minimum. \"Nozickian\" refers to Robert Nozick's rights-based version.", "standard meaning"], "g-licensing-occupational": ["Licensing (occupational)", "State permission required to work in a trade or profession. I believe licensing should exist only to prevent real harm.", "standard meaning; site S5"], "g-life-with-labor": ["Life with labor", "One of the three outcomes a victim may choose once an offender reaches three marks or the grave tier: life under compelled labor instead of execution or experimentation.", "site Glossary (Grave tier); site S6"], "g-limited-democracy": ["Limited democracy", "My other name for the epistocratic republic: \"a limited democracy rather than a full democracy,\" because the franchise is restricted to qualified voters.", "site S3"], "g-maga": ["MAGA", "\"Make America Great Again,\" the Trump-aligned political movement. \"MAGA restrainers\" are the part of it that wants fewer foreign military commitments, such as less aid to Ukraine and no war with Iran.", "standard meaning"], "g-mandated-choice-and-presumed-consent": ["Mandated choice and presumed consent", "Presumed consent treats everyone as an organ donor unless they opt out; mandated choice requires everyone to state a yes or no, as when getting a driver's license. I believe in mandated choice, never presumed consent.", "standard meaning; site S10"], "g-mark": ["Mark", "In my framework, a mark would be a recorded conviction counted toward the repeat-offender threshold, and every mark would include supervised hard labor. Every mark should require proof beyond reasonable doubt. As I write in Criminal Justice & Security: Repeat Offenders and Forfeiture of the Right to Life.", "site S6"], "g-market-pronatalism": ["Market pronatalism", "Pronatalism is policy aimed at raising birth rates. Mine uses credits, tax relief, and housing deregulation rather than mandates, with a goal of 2.1 children per woman; \"the nation should renew itself through its own families\" (S5).", "standard meaning; site S5"], "g-medicaid-medicare-social-security": ["Medicaid, Medicare, Social Security", "Medicaid is joint federal-state health coverage for low-income people; Medicare is federal health insurance mainly for those 65 and older; Social Security pays retirement and disability benefits funded by payroll taxes. I believe Social Security and Medicare should be voluntary for new entrants and kept in full for anyone within 10 years of full retirement age.", "standard meaning; site S5"], "g-medicaid-work-requirement-grace-period": ["Medicaid work-requirement grace period", "An optional \"hold harmless\" period through June 30, 2027 that federal regulators offered states before enforcing the new Medicaid work requirement. I grade it Directionally opposed.", "site S12"], "g-meritocracy": ["Meritocracy", "A system that awards positions by ability and achievement rather than by group or connections.", "standard meaning"], "g-metaethics": ["Metaethics", "The study of what moral claims are and whether moral facts exist, as opposed to normative ethics, which asks which acts are right.", "standard meaning; site S1"], "g-militant-democracy": ["Militant democracy", "Karl Loewenstein's 1937 term for a democracy that legally restricts movements hostile to democracy itself, as Germany's Basic Law allows bans on anti-constitutional parties. It describes my excluded-ideologies amendment, which bans no party and no speech.", "standard meaning"], "g-miller-v-alabama-2012": ["Miller v. Alabama (2012)", "Supreme Court case barring mandatory life without parole for offenders under 18.", "standard meaning"], "g-minimum-wage": ["Minimum wage", "A legal floor on hourly pay. I want none, state minimums included.", "standard meaning"], "g-mixed-constitution": ["Mixed constitution", "A government that blends elements of rule by the one, the few, and the many, as Aristotle and later the American founders described.", "standard meaning"], "g-money-bail-and-pretrial-release": ["Money bail and pretrial release", "Money bail requires a payment to be released before trial, refunded if the defendant shows up to court. I believe defendants should be released before trial by default and money bail abolished.", "standard meaning; site S3"], "g-moral-anti-realism": ["Moral anti-realism", "Moral anti-realism is the view that there are no moral facts that hold independently of what anyone thinks or prescribes. As I explain in Ethical and Philosophical Framework: Moral anti-realism.", "standard meaning; site S1"], "g-moral-realism": ["Moral realism", "The view that there are objective moral facts that hold whatever anyone thinks. \"Realist replies\" are the counterarguments realists make against anti-realism, which S1 answers.", "standard meaning"], "g-mosque-cap": ["Mosque cap", "The part of the building bar that would allow no new mosques and cap existing ones at today's number (S1, S3).", "site S1, S3"], "g-mothers-exemption": ["Mothers' exemption", "My proposed income-tax exemption for mothers: half for mothers of three children and full for mothers of four, part of the family package meant to raise births under lower immigration.", "site S5, S3"], "g-mugler-v-kansas-1887": ["Mugler v. Kansas (1887)", "Supreme Court case upholding Kansas's alcohol ban without compensation to a brewer, holding that banning a use harmful to the public is not a taking. My S9 Q&A cites it for the uncompensated Sanctuary Plan transfers.", "site S9"], "g-multiculturalism": ["Multiculturalism", "The view or policy that a country should keep several distinct cultures side by side rather than expect newcomers to assimilate. I believe it works only when the cultures share important common values.", "standard meaning; site S7"], "g-muslim-brotherhood": ["Muslim Brotherhood", "A Sunni movement founded in Egypt in 1928 by Hassan al-Banna that seeks government by Islamic law, with national branches and offshoots, including Hamas, across the Middle East and in the West. I believe the U.S. should designate as a terrorist organization every chapter shown to support terrorism or to organize violence.", "standard meaning; site S8"], "g-nation-building": ["Nation-building", "Using military occupation and aid to rebuild another country's government and institutions. I reject it: I believe the United States should avoid \"open-ended nation-building\" (S8).", "standard meaning; site S8"], "g-national-conservatism": ["National conservatism", "A movement, associated with Yoram Hazony, that stresses national sovereignty, borders, cultural cohesion, and often religion in public life.", "standard meaning"], "g-national-individualism": ["National individualism", "My own label for my politics: rights belong to individuals, with free markets and a minimal, opt-in fiscal state, held within a strong nation defined by shared Western values, firm borders, and assimilation. I believe the state exists to protect negative rights and the security of the community that sustains them.", "site home page"], "g-national-initiative": ["National initiative", "A constitutional amendment I support that would let qualified voters put federal statutes (1% of qualified voters' signatures) and amendments (2%) on the ballot. Only voters who meet the full election stack (ID, the voter license test, net-taxpayer status, no felony bar) may sign and vote, and no initiative can override protected rights.", "site S3"], "g-nato": ["NATO", "The North Atlantic Treaty Organization, the U.S.-European defense alliance. I support it only when it serves U.S. interests.", "standard meaning"], "g-nazism-and-communism": ["Nazism and communism", "Nazism is the racist, totalitarian ideology of Hitler's Germany; communism is the ideology of abolishing private property under one-party rule, as in the Soviet Union and Maoist China. Both are among my four excluded ideologies.", "standard meaning; site S1"], "g-negative-rights": ["Negative rights", "Negative rights are side-constraints against interference and harm. As I explain in Ethical and Philosophical Framework: Axioms.", "standard meaning; site S1"], "g-negative-utilitarianism": ["Negative utilitarianism", "A form of utilitarianism focused on reducing suffering rather than increasing happiness. David Pearce holds it; I am deontological instead.", "standard meaning"], "g-neh": ["NEH", "The National Endowment for the Humanities, a federal grant agency. Some NEH funds are reserved for the arch, which is why I grade it directional and would prefer private or opt-in money.", "standard meaning; site S12"], "g-net-taxpayer-franchise-net-fiscal-voting-bar": ["Net-taxpayer franchise (net fiscal voting bar)", "I believe only net taxpayers should vote. A person would count as a net taxpayer for the prior completed tax year when taxes paid exceed personally directed transfers received and income-tax liability is positive. The franchise would track current net contribution, not lifetime payroll history, because the franchise decides other people's money. Also called the net taxpayer voting bar. The full measurement rules — what counts as a transfer received, which taxes count as paid, the tax-filing unit, joint filers, refundable credit cash-outs, the mothers' exemption, grandfathered Social Security and Medicare, and when the bar lifts — I lay out in Authority & Civil Liberties: net fiscal voting bar and in the questions under Voting and Elections.", "site S3"], "g-ngo-grants": ["NGO grants", "Government money given to nongovernmental (nonprofit) organizations. I believe grants should end, with contracts for specific services only.", "standard meaning; site S5"], "g-nit-negative-income-tax": ["NIT (negative income tax)", "Milton Friedman's idea of paying people below an income line a share of the gap, shrinking as they earn more, in place of other welfare programs. My earnings-only top-up is a negative income tax paid only on earned income.", "standard meaning; site Glossary (Earnings-only top-up)"], "g-nozickian": ["Nozickian", "After Robert Nozick, whose Anarchy, State, and Utopia (1974) treats rights as side-constraints, defends a minimal state, and rejects distributive patterns as the measure of justice. My rights theory is Nozickian in that sense, with forfeiture and a minimal floor added.", "standard meaning; site S1, S3"], "g-nuremberg-code": ["Nuremberg Code", "The 1947 research-ethics principles from the Nazi doctors' trial, whose first rule is that \"the voluntary consent of the human subject is absolutely essential.\" I acknowledge my experimentation track conflicts with it.", "standard meaning; site S10"], "g-office-bar-authority-roles": ["Office bar (authority roles)", "Civic disability I would apply to adherents of an excluded ideology (Nazism, communism, socialism, Islam): they should not be allowed to hold authority roles — elected or appointed public office; law enforcement, military, and intelligence; judges and prosecutors; immigration and other adjudicators who decide status or benefits; K-12 public curriculum authority. Those roles should be sworn. Lying on the oath should be perjury (Oath of Office and Perjury). Not covered: ordinary non-authority taxpayer jobs (accountant, grounds worker, non-adjudicative clerk, and the like). Belief, speech, and home practice would stay free. The separate building bar would cap places that promote an excluded ideology (Property Rights).", "site S1, S3, S4"], "g-opt-in-fiscal-voluntarism": ["Opt-in (fiscal voluntarism)", "My rule that welfare, Social Security, Medicare, the public health plan, subsidies, and similar programs should be opt-in. For subsidies, any public money should be \"drawn only from taxpayers who opt in to fund it\" (S9).", "site S5, S9, S10"], "g-outer-space-treaty": ["Outer Space Treaty", "The 1967 treaty at the base of space law: it bars nuclear weapons and other weapons of mass destruction in orbit, bars any nation from claiming the Moon or other celestial bodies, and reserves them for peaceful purposes. I believe it should stay as the civil baseline but be read to allow defense.", "standard meaning; site S8"], "g-paid-leave-mandate": ["Paid-leave mandate", "A law requiring employers to pay workers during family or medical leave. I oppose it.", "standard meaning"], "g-patriots-ecr-esn": ["Patriots, ECR, ESN", "Three right-wing groups in the European Parliament: Patriots for Europe, European Conservatives and Reformists, and Europe of Sovereign Nations.", "standard meaning"], "g-pattern-recognition-pattern-realism": ["Pattern recognition (pattern realism)", "My view that noticing real group patterns is reasonable even when a particular person turns out to be harmless, and that statistics shouldn't be denied. Group statistics never become verdicts on individuals; each person is judged on their own values and conduct.", "site S6, S7, home page"], "g-pell-grants": ["Pell Grants", "Federal grants for lower-income undergraduate students that, unlike loans, don't have to be repaid. I would make them opt-in.", "standard meaning; site S5"], "g-penal-maximalism": ["Penal maximalism", "My label for using the most severe penalties across a wide range of crimes, such as mandatory death and the three-mark rule, all grounded in forfeiture.", "site S6"], "g-phenomenal-consciousness-first-order-sentience": ["Phenomenal consciousness (first-order sentience)", "Having subjective experience, meaning there is something it feels like to be that being. \"Any being, biological or artificial, that possesses first-order subjective experience is to be treated as a rights-bearer under my framework. Higher-order self-awareness is not required.\"", "site Glossary (Sentience basis); site S1"], "g-police-profiling": ["Police profiling", "Police using group traits, such as age, sex, or behavior patterns, to decide whom to check. I would allow it only at checkpoints everyone already passes through, to pick who gets a second look, alongside random checks. A stop or search of a particular person on the street should rest on that person's own behavior, and profiling should never decide guilt (Group Statistics and Individual Judgment).", "site S1"], "g-polity-politeia": ["Polity (politeia)", "Aristotle's name for the good form of rule by the many: a mixed constitution that blends democracy and oligarchy, with citizenship tied to qualifications. I call my qualified-franchise republic \"a modern Aristotelian polity.\"", "standard meaning"], "g-positive-rights": ["Positive rights", "Claims to be provided something, such as welfare, health care, or housing. In S1 I say: \"I reject positive rights.\" My floor is \"not a right anyone can claim.\"", "standard meaning; site S1"], "g-precautionary-tier": ["Precautionary tier", "The lowest sentience class, for insects. Deliberately killing an animal in it \"should carry a small fine.\" Bivalves are likely not sentient and are not in it, so killing one carries no fine; farming them ends with aquaculture for consistency.", "site Glossary (Sentience class)"], "g-prescriptivism-universal": ["Prescriptivism (universal)", "R. M. Hare's view that moral statements are prescriptions, like commands, that the speaker must be willing to apply to everyone in relevantly similar cases. S1: my view is \"prescriptivist in form, in the tradition of R. M. Hare.\"", "standard meaning; site S1"], "g-price-stability-rule": ["Price-stability rule", "A fixed rule directing the central bank to keep inflation low and steady, rather than giving it broad discretion.", "standard meaning"], "g-procreative-liberty": ["Procreative liberty", "John Robertson's principle that people have a strong liberty interest in deciding whether and how to have children, including through reproductive technology. My S10 views on IVF, embryo screening, gene editing, and cloning sit near it, though mine rest on sentience-based negative rights rather than autonomy alone.", "standard meaning"], "g-progressivism": ["Progressivism", "A reform movement on the left that seeks wider state action to correct social and economic inequality, often through group-based policy. I call myself non-progressivist: I believe the state should protect rights, not equalize outcomes or judge people by group.", "standard meaning"], "g-prop-12-california": ["Prop 12 (California)", "A 2018 California ballot measure setting minimum space rules for egg-laying hens, breeding pigs, and veal calves and banning sales of products that don't meet them. S11 faults the Republican push to override it, since I believe the United States should ban animal agriculture.", "standard meaning; site S11"], "g-prop-209-bleemer-study": ["Prop 209 (Bleemer study)", "California's 1996 measure ending race-based admissions at public universities. Bleemer (2022) found that underrepresented minority applicants then enrolled at less selective colleges, earned fewer degrees, and earned about 5% less; my S7 cites it as counter-evidence and answers that it \"does not make the preference just.\"", "site S7"], "g-property-exceptions-two": ["Property exceptions (two)", "The two cases S3 puts outside my otherwise permanent property right: \"one is barred by amendment, and in the other the owners forfeited it.\" The first is the building bar; the second is the Sanctuary Plan's uncompensated conversion of animal-industry firms.", "site S3"], "g-prophylaxis": ["Prophylaxis", "A preventive measure taken before harm happens, rather than punishment after it. In my resolution of the first apparent tension on the home page, the office bars and mosque cap are \"prophylaxis, not punishment,\" protecting the rights order from ideologies hostile to it.", "standard meaning; site home page"], "g-proportionality-punishment": ["Proportionality (punishment)", "The principle that a punishment or defensive response should match the severity of the wrong. In my framework it is applied once, at the forfeiture decision: what is forfeited corresponds to the violation.", "standard meaning; site S1, S6"], "g-psychedelic-therapy": ["Psychedelic therapy", "Clinical use of drugs like psilocybin or MDMA alongside therapy. I believe it should be available by prescription.", "standard meaning"], "g-punitive-civil-libertarian": ["Punitive civil libertarian", "Another name I use for my criminal-justice view: a maximal penalty scale combined with strict procedural safeguards.", ""], "g-qa": ["Q&A", "A collapsible question-and-answer callout I use that answers a likely objection to a position.", "site"], "g-qualified-franchise": ["Qualified franchise", "A restricted right to vote. I believe that, on top of voter ID and the felony bar, every voter should meet a stake qualification (net taxpayer) and a competence qualification (the voter license test).", "site Glossary (Epistocratic republic); site S3"], "g-qualified-immunity": ["Qualified immunity", "A court-made doctrine that shields government officials, including police, from personal liability for damages unless they violated \"clearly established\" law. I believe it should be abolished and police held to a higher liability standard.", "standard meaning; site S6"], "g-queerness-argument": ["Queerness argument", "J. L. Mackie's argument that objective moral facts would be \"queer,\" utterly unlike anything else in the universe, so it is more reasonable to deny they exist. One of my three arguments for anti-realism in S1.", "standard meaning; site S1"], "g-race-realism": ["Race realism", "Movements holding that races differ innately in traits such as intelligence and that policy should reflect it. Unlike them, I would bar private actors from deciding by group and make the individual the only unit of verdict.", "standard meaning"], "g-ranked-choice-voting": ["Ranked-choice voting", "Voters rank candidates in order; if no one has a majority, the last-place candidate is dropped and those ballots move to their next choice until someone wins. I believe it should be required everywhere by amendment.", "standard meaning; site S3"], "g-realism-foreign-policy": ["Realism (foreign policy)", "The view in international relations that states act and should act on national interest and power rather than ideals or international law. I call mine \"America First realism with selective Western imperialism\" (S8).", "standard meaning; site S8"], "g-rebuttable-presumption": ["Rebuttable presumption", "A starting assumption against admission that an individual applicant could overcome with clear and convincing evidence of conduct and record, never by declaration alone. I would apply it to Muslim applicants and to applicants from countries where Islamist movements govern or where most people back state-enforced religious law. I set this out in Foreign Policy & International Relations: Immigration and Borders.", "site S8"], "g-red-flag-laws": ["Red-flag laws", "Laws letting a court temporarily remove guns from someone shown to be a danger to themselves or others. I support them by court order, with background checks.", "standard meaning; site S7"], "g-regime-change": ["Regime change", "Removing a foreign government, here by force. I want it in Iran, sparing the people, but without nation-building afterward.", "standard meaning"], "g-regulatory-takings": ["Regulatory takings", "Regulation so severe that it amounts to taking property, which under the Fifth Amendment can require compensation. I believe regulation that eliminates the economically beneficial uses of property, or destroys most of its value, is a taking and should require compensation.", "standard meaning; site S3"], "g-relativism": ["Relativism", "The view that moral truth varies by culture or person, so no moral view is better than another. My anti-realism is not relativist.", "standard meaning"], "g-reparations": ["Reparations", "Payments to make amends for a past wrong, here historical injustices against Black Americans. I would charge them only to voters of the responsible government, as a principle, while keeping the secret ballot.", "site S7"], "g-replacement-fertility": ["Replacement fertility", "The birth rate at which a population replaces itself from one generation to the next without immigration, about 2.1 children per woman in developed countries. The U.S. rate was about 1.6 in 2024, and I believe America should get back above replacement.", "standard meaning; site S5"], "g-reproductive-cloning-and-research-cloning": ["Reproductive cloning and research cloning", "Reproductive cloning creates a baby genetically identical to an existing person; research cloning creates embryos for study. I believe reproductive cloning should not be banned, since a clone \"is a person like anyone else, not a product,\" while research cloning should stay inside the fetal, sentience, and research rules, with no gestation to birth for research.", "site S10"], "g-restore-britain-and-reform-uk": ["Restore Britain and Reform UK", "Two British right-wing parties. Restore Britain, led by Rupert Lowe, is closest to me on crime, pledging a binding referendum on restoring the death penalty; Reform UK, led by Nigel Farage, is next.", "site S11"], "g-restrictionism": ["Restrictionism", "Favoring sharply lower immigration and tighter entry rules. I call my version \"Values-selective\", which selects by fit with Western values.", "standard meaning"], "g-retributivism": ["Retributivism", "The theory that punishment is justified because the offender deserves it, in proportion to the crime. I call my severe version \"Hard retributivism through rights forfeiture\", in which a crime forfeits the rights that would otherwise protect the offender.", "standard meaning; site S6"], "g-rights-forfeiture-theory-of-punishment": ["Rights-forfeiture theory of punishment", "The theory, defended by Christopher Heath Wellman, that punishment is permissible because an offender who violates another's rights forfeits some of their own. I apply it across my whole system: mandatory death, the three-mark rule, and the experimentation track.", "standard meaning; site S1"], "g-ritual-slaughter": ["Ritual slaughter", "Religious methods of slaughtering animals, such as halal and kosher slaughter without stunning. I believe it should be banned for every faith.", "standard meaning; site S1, S4"], "g-roper-v-simmons-2005": ["Roper v. Simmons (2005)", "Supreme Court case barring the death penalty for crimes committed under age 18.", "standard meaning"], "g-s11-scorecard": ["S11 scorecard", "My net alignment scores for parties in S11: GOP +9, Libertarian and Constitution parties +3, Democrats -10, Greens and DSA -13.", "site S11"], "g-s12-grades": ["S12 grades", "My five-step scale for grading administration actions and politicians against my positions: Aligned, Directionally aligned (details differ), Mixed, Directionally opposed, and Opposed.", "site S12"], "g-safe-third-country": ["Safe third country", "A country other than the refugee's home and the destination where the refugee can be sent to seek protection. I believe resettled refugees being removed should go only to a safe third country.", "standard meaning; site S8"], "g-sanctuary-cities": ["Sanctuary cities", "Cities and counties that limit cooperation with federal immigration enforcement. Not related to my Sanctuary Plan for animals. I believe they should be abolished.", "standard meaning; site S8"], "g-sanctuary-forfeiture": ["Sanctuary forfeiture", "My ground for taking animal-industry assets without compensation: \"Animal-industry firms forfeited those property protections by using their assets to violate animals' rights.\" Those assets would be compelled to convert, divest, or liquidate, with no compensation to owners and shareholders; I call it \"a one-time forfeiture, not a break in the property right.\"", "site S1 (note \"Forfeiture: Sanctu
