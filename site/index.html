ary Plan and property\"); site S3, S9"], "g-sanctuary-levy": ["Sanctuary Levy", "A single flat, time-limited levy I would impose on income above its own line, never above 3%, legally dedicated to sanctuary care for the animals alive when animal agriculture, commercial fishing, breeding mills, and animal testing shut down, to repaying the sanctuary bonds, and to a closing endowment for the last animals. It should only be lowered, and it should end when the national sanctuary population falls below 1% of its starting animal units and the bonds are repaid. I set this out in Energy & Environment: Sanctuary Plan and Domestic Policy & Governance: Taxation.", "site S9, S5"], "g-sanctuary-license": ["Sanctuary license", "The license a nonprofit would have to hold to run a sanctuary under the Sanctuary Plan after the emergency phase. It would set care standards, sterilization, adoption vetting and unannounced inspections, and bar the sale of animals or animal products and all breeding. Licensed operators should be paid a fixed amount per animal per year from the Sanctuary Levy, accredited by an independent body and inspected by the state, and should hold use of the land, never ownership, while any animals remain on it. Each site should transfer from the state once its operator passes accreditation. I lay this out in Energy & Environment: Handover to Nonprofit Operators.", "site S9"], "g-sanctuary-plan": ["Sanctuary Plan", "My plan for a day-one shutdown of animal agriculture, wild-capture commercial fishing, aquaculture, commercial breeding mills, and animal testing, with no wind-down. Every animal alive that day should be kept alive in sanctuary (then licensed nonprofit care) or adopted under strict vetting, with no breeding, funded by converted or liquidated industry equity, sanctuary bonds, and the Sanctuary Levy.", "site S9"], "g-sanctuary-system": ["Sanctuary system", "The sanctuaries and licensed nonprofit operators that would care for every animal alive at the shutdown for its natural life under the Sanctuary Plan.", "site S9"], "g-scientific-naturalism": ["Scientific naturalism", "The view that the natural world is all there is, or all we can know, and that science is the best way to know it. My naturalism is about method and evidence; my anti-naturalism is a separate claim, that nature is not a moral standard.", "standard meaning; site S1"], "g-seafood-strategy-and-rancher-support": ["Seafood strategy and rancher support", "The October 2026 America First Seafood Strategy promoting fishing and aquaculture, and the September 2026 orders supporting ranchers and livestock markets. I grade both Opposed because I believe animal agriculture and commercial fishing should end.", "site S12"], "g-secret-ballot": ["Secret ballot", "Voting in private so no one can know how a given person voted.", "standard meaning"], "g-section-numbers-s1-s13": ["Section numbers (S1-S13)", "The section numbers I use: S1 Ethical and Philosophical Framework, S2 Political and Social Character, S3 Authority & Civil Liberties, S4 Religion & Secularism, S5 Domestic Policy & Governance, S6 Criminal Justice & Security, S7 Cultural & Social Issues, S8 Foreign Policy & International Relations, S9 Energy & Environment, S10 Bioethics, Progress, & Technology, S11 Modern Political Parties, S12 Current Politics, S13 News Commentary.", "site"], "g-secularism": ["Secularism", "Keeping religion and government separate. Mine is strict: I believe church and state should be strictly separated, churches taxed, no school prayer, and ritual slaughter banned for every faith (S4).", "standard meaning; site S4"], "g-selective-western-imperialism": ["Selective Western imperialism", "My phrase for engaging forcefully against direct threats, especially Iran and extremist Islam, to defeat and contain them, without governing territory or open-ended nation-building (S8).", "site S8"], "g-sentience-classes": ["Sentience classes", "The class a species would fall in for criminal purposes under my framework, set by an expert board on the best available scientific consensus and revised only for acts after a revision takes effect. The high class would cover mammals, birds, cephalopods, and decapod crustaceans such as crabs and lobsters — including rats, mice, and pigeons; fish and shrimp would be placed species by species; insects would sit on the lowest, precautionary tier; bivalves are likely not sentient and sit in no class. Pest status should not demote a species. Deliberately killing a high-class animal outside self-defense or defense of rights is murder and should be on the capital track; a qualifying infestation at a dwelling, food store, or medical facility is a clear disease or rights threat under that defense; killing a lower-class animal should be a mark; deliberately killing a lowest-tier animal should carry a small fine. I set this out in Ethical and Philosophical Framework: Sentience Determination.", "site S1"], "g-sentientism": ["Sentientism", "Any being, biological or artificial, that possesses first-order subjective experience is to be treated as a rights-bearer under my framework. Higher-order self-awareness is not required. For elective abortion, I believe it should be banned from conception by constitutional amendment as a safeguard (Abortion ban (from conception)). The rights claim starts at 12 weeks; the earlier ban is not a rewrite of this criterion into conception-as-rights (Abortion and Bioethics). As I write in Ethical and Philosophical Framework: Axioms.", "site S1"], "g-sharia": ["Sharia", "Islamic law, drawn from the Quran and the example of Muhammad as interpreted by jurists, covering worship, family life, and crime. I protect private religious practice in the home, but I believe sharia should never be state law.", "standard meaning; site S4"], "g-side-constraint": ["Side-constraint", "Robert Nozick's term for a limit on action that may not be crossed even to reach a good goal. As I write, rights are side-constraints, \"not goals to maximize,\" and \"Negative rights are side-constraints against interference and harm.\"", "site Glossary (Negative rights); site S1; standard meaning"], "g-snap": ["SNAP", "The Supplemental Nutrition Assistance Program, often called food stamps. I believe it should be wound down, with phase-outs that honor current recipients.", "standard meaning"], "g-social-conservatism": ["Social conservatism", "A political outlook that defends traditional morality, family structure, and religion's role in public life, often through law. I share the preference for traditional family life, but I am secular, oppose Christian law, and support same-sex marriage and legal vice.", "standard meaning"], "g-social-transition": ["Social transition", "Treating a child as the other gender socially, through a new name, pronouns, clothing, or facilities, without medical treatment. I believe public schools should never socially transition students or keep it from parents.", "standard meaning; site S7"], "g-socialism-excluded": ["Socialism (excluded)", "Excluded socialism = the ideology of state or collective ownership of productive property, central planning in place of prices, and compulsory redistribution beyond a minimal rights-protection floor, imposed by force. That is what the excluded-ideologies amendment I support would bar from office and from building places that promote it (Excluded ideologies). Not socialism as I use the term: a flat income tax. The named minimal welfare / earnings-only top-up floor; or the time-limited flat Sanctuary Levy (≤3%, income above $75,000 single / $150,000 joint) that funds sanctuary care for animals freed by the shutdown. Those are narrow compelled payments for named rights-protection jobs, not collective ownership of production. I judge social democracy (markets + a large welfare state) as too large a compulsory state, not as excluded socialism. Voluntary cooperatives competing in markets should be allowed. I set this out in Domestic Policy: Socialism.", "site S5"], "g-stake-qualification": ["Stake qualification", "The first half of my qualified franchise: \"only net taxpayers would vote, and people living on personally directed transfers would not, because the franchise decides other people's money.\" I call it \"close to what Aristotle called timocracy.\"", "site S3"], "g-stoicism": ["Stoicism", "The ancient school (Epictetus, Marcus Aurelius) that teaches virtue, self-control, and calm acceptance of what one can't change. I use it for personal ethics and composure only.", "standard meaning; site S1"], "g-subject-of-a-life": ["Subject-of-a-life", "Tom Regan's test for having rights: being a creature with beliefs, desires, memory, a sense of its own future, and a welfare of its own. I use sentience instead, which is broader.", "standard meaning"], "g-substrate-neutral": ["Substrate-neutral", "Not depending on what a being is made of. As I use it, moral status rests on experience, \"biological or artificial,\" so a sentient AI would count.", "standard meaning; site S1"], "g-svp": ["SVP", "The Swiss People's Party, Switzerland's largest party, known for restrictive immigration and direct democracy.", "standard meaning; site S11"], "g-sweden-democrats-and-the-tido-agreement": ["Sweden Democrats and the Tidö Agreement", "The Sweden Democrats are a Swedish national-conservative party. The 2022 Tidö Agreement between the Moderates, Christian Democrats, Liberals, and Sweden Democrats called for double penalties for gang criminals and tougher sentences.", "site S11"], "g-tariffs-reciprocal-and-replacement": ["Tariffs (reciprocal and replacement)", "Tariffs are taxes on imports. As I write, they are \"good in theory, questionable in practice\" and belong to Congress. The reciprocal tariffs (April 2025) and the replacement tariffs imposed after the Supreme Court held in February 2026 that IEEPA doesn't authorize tariffs are both graded Directionally opposed.", "site S8, S12"], "g-techno-optimism": ["Techno-optimism", "Confidence that new technology will, on balance, make life much better.", "standard meaning"], "g-term-limits": ["Term limits", "Caps on how many terms an official can serve. I want none, with three-year election cycles for every elected office.", "standard meaning; site S3"], "g-three-mark-rule-repeat-offender-threshold": ["Three-mark rule (repeat-offender threshold)", "The repeat-offender threshold, as I would set it, is three marks. When an offender reaches three marks, the offender should forfeit the right to life. I set this out in Criminal Justice & Security: Repeat Offenders and Forfeiture of the Right to Life.", "site S6"], "g-threshold-deontology": ["Threshold deontology", "In standard form (Michael Moore), rights hold unless the consequences of respecting them pass a very high threshold. \"I'm a threshold deontologist, not a utilitarian\" (S1). In mine, the threshold is the agent's own violation set in Axiom 6: violating rights by force or fraud, or directly imposing severe non-consensual risk.", "standard meaning; site S1"], "g-timocracy": ["Timocracy", "In Aristotle, a constitution where political rights depend on a property stake (Plato used the word for rule by the honor-loving). I say my net-taxpayer rule is \"close to what Aristotle called timocracy.\"", "standard meaning; site S3"], "g-top-two-primary": ["Top-two primary", "A primary where all candidates run on one ballot and the top two finishers advance regardless of party. I believe parties are private associations and top-two primaries should be banned.", "standard meaning; site S3"], "g-transgenderism": ["Transgenderism", "A general term for transgender identity and transition. My S7 calls it \"a mental illness\"; I believe adults should be free to transition privately and minors should get no treatment.", "standard meaning; site S7"], "g-transhumanism": ["Transhumanism", "The movement to use technology, such as genetic engineering and brain-computer interfaces, to overcome human biological limits. In S10 I say: \"I fully support transhuman technology.\"", "standard meaning; site S10"], "g-transition-levy": ["Transition levy", "A temporary tax of 16% of all wages I would impose, split between worker and employer, that would replace today's payroll taxes and pay only for the Social Security and Medicare benefits already promised, then the debt. It should never rise above 16%, should step down as the debt is paid, and should end when the protected benefits end. I lay this out in Domestic Policy & Governance: Taxation.", "site S5"], "g-transition-surcharge": ["Transition surcharge", "A temporary 2-point surcharge on my flat income-tax rates through 2041, so 22% instead of 20%, and 17% instead of 15% on capital income (S10).", "site S5, S10"], "g-triumphal-arch-white-house-ballroom-oval-office-national-monument": ["Triumphal arch, White House ballroom, Oval Office National Monument", "Three administration projects: a planned 250-foot arch on Memorial Circle near Arlington National Cemetery; a new White House East Wing ballroom; and a national monument designation for the Oval Office and nearby rooms under the Antiquities Act. I grade the arch Directionally aligned and the other two Aligned.", "site S12"], "g-true-threats-and-incitement": ["True threats and incitement", "The narrow categories of speech the Supreme Court allows to be punished: serious statements of intent to commit violence against someone (true threats) and speech intended and likely to cause imminent lawless action (incitement). I believe they should be the only punishable speech.", "standard meaning; site S7"], "g-two-state-solution-and-annexation": ["Two-state solution and annexation", "The two-state solution is a proposed Israeli state alongside an independent Palestinian state; annexation is a state formally absorbing territory. I oppose a two-state solution and believe West Bank annexation is justified.", "standard meaning; site S8"], "g-ubi-and-citizen-dividend": ["UBI and citizen dividend", "A universal basic income pays every adult a regular sum with no conditions; a citizen dividend shares public revenue, such as from resources or AI, with every citizen. I reject both.", "standard meaning; site S10"], "g-unanimous-jury": ["Unanimous jury", "A rule that every juror must agree to convict. I believe a unanimous jury of at least twelve should be required in civil and criminal cases alike.", "standard meaning; site S3"], "g-usda-ers-and-pew": ["USDA ERS and Pew", "The U.S. Department of Agriculture's Economic Research Service and the Pew Research Center, two of the official or survey sources behind my charts.", "standard meaning"], "g-utilitarianism": ["Utilitarianism", "The theory that the right act is the one that produces the most overall well-being. Peter Singer's animal ethics is utilitarian. I reject it: rights are side-constraints that the numbers never override.", "standard meaning"], "g-vaccines-opt-in": ["Vaccines (opt-in)", "My view that vaccines should be opt-in only, with no mandates even in emergencies.", "site S10"], "g-values-based-immigration-western-values": ["Values-based immigration (Western values)", "My immigration rule that fit with Western values comes first and labor needs second, where \"Western\" is \"a set of values, not an ethnicity.\" Applicants are vetted as individuals on verified conduct and record.", "site S2, S8"], "g-verified-conduct-test": ["Verified-conduct test", "How a Muslim applicant could overcome the presumption: verified evidence of conduct and record showing acceptance of the Constitution over religious law, equal rights for women and non-Muslims, freedom to leave the faith, and rejection of violence; a declaration alone never meets the burden (S4). Passing it would not lift the office bar.", "site S4, S8"], "g-voter-license-test": ["Voter license test", "The test on issues, civics, and laws that I believe every voter should pass. A commission should write it, with equal seats for each major party, an equal number of members drawn by lot from licensed voters in neither, a chair drawn by lot from that group, and a two-thirds vote to change the question bank; the question bank should be public, test facts and never opinions, and be free and retakeable, with free prep courses; pass rates should be published by race, sex, age, and party, with any question one group fails at a markedly higher rate reviewed for bias.", "site S3"], "g-vouchers-esas-and-tax-credit-scholarships": ["Vouchers, ESAs, and tax-credit scholarships", "Ways to send public or tax-favored money to private and religious schools: vouchers pay tuition, education savings accounts (ESAs) fund approved costs, and tax-credit scholarships give a tax credit for donations to scholarship groups. I oppose all three; my per-child money follows the child only to public or charter schools.", "standard meaning; site S5, S11"], "g-war-powers-resolution": ["War Powers Resolution", "A 1973 law requiring the President to notify Congress within 48 hours of sending forces into hostilities and to withdraw within 60 days, plus 30 for withdrawal, unless Congress authorizes. I believe Congress must authorize any sustained campaign within 30 days.", "standard meaning; site S8"], "g-water-rights": ["Water rights", "Legal rights to use water from a river, lake, or aquifer. In my view they are property.", "standard meaning"], "g-western-civilization-western-heritage": ["Western civilization (Western heritage)", "In my usage, \"Western\" is \"a set of values, not an ethnicity\" (S2, S8). I call moderate Christianity and Western heritage \"good\" (S4).", "site S2, S4"], "g-who": ["WHO", "The World Health Organization, the UN health agency. I believe the U.S. should not be bound by it.", "standard meaning"], "g-wild-animal-suffering": ["Wild-animal suffering", "The view (Oscar Horta, Jeff McMahan) that suffering in nature, from predation, disease, and starvation, matters morally and that humans should act to reduce it. I believe predation is a rights violation that the U.S. government should stop within its borders, in phases.", "standard meaning; site S1, S7"], "g-woodson-v-north-carolina-1976": ["Woodson v. North Carolina (1976)", "Supreme Court case striking down mandatory death sentences, requiring individual sentencing in capital cases.", "standard meaning"], "g-zero-bracket": ["Zero bracket", "The first slice of income taxed at 0% under my flat tax: about $42,000 single and $84,000 joint.", "site S5"], "g-zero-tolerance": ["Zero tolerance", "As I use it, every offense in the targeted categories is met with enforcement and punishment, without informal leniency or warnings. I apply it to criminals who violate others' rights and to riots, blockades, and takeovers.", "site S6"]}</script><script type="application/json" id="gmap">{"60-day restraint":"g-60-day-restraint","abolitionism (animal rights)":"g-abolitionism-animal-rights","abolitionism":"g-abolitionism-animal-rights","abolitionist project (pearce)":"g-abolitionist-project-pearce","abolitionist project":"g-abolitionist-project-pearce","abortion ban from conception":"g-abortion-ban-from-conception","acled":"g-acled","actuarial sex facts":"g-actuarial-sex-facts","age of criminal responsibility":"g-age-of-criminal-responsibility","agency":"g-agency","agnostic atheism":"g-agnostic-atheism","ai, agi":"g-ai-agi","ai preemption":"g-ai-preemption","alaska certification suit":"g-alaska-certification-suit","alien enemies act":"g-alien-enemies-act","ama and helsinki codes":"g-ama-and-helsinki-codes","ama":"g-ama-and-helsinki-codes","helsinki codes":"g-ama-and-helsinki-codes","america first":"g-america-first","amnesty":"g-amnesty","anarcho-capitalism":"g-anarcho-capitalism","anti-collectivism":"g-anti-collectivism","anti-naturalism (sentientist)":"g-anti-naturalism-sentientist","anti-naturalism":"g-anti-naturalism-sentientist","anti-totalitarian parity":"g-anti-totalitarian-parity","antitrust":"g-antitrust","aquaculture and breeding mills":"g-a
